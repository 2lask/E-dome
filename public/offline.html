<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Dome — Hors connexion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #080808; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; }
    .container { max-width: 400px; }
    h1 { font-size: 32px; margin-bottom: 8px; }
    .accent { color: #C4956A; }
    p { color: rgba(255,255,255,0.5); margin-top: 12px; font-size: 14px; line-height: 1.6; }
    .icon { font-size: 64px; margin-bottom: 24px; }
    button { margin-top: 24px; padding: 12px 32px; background: #C4956A; color: #000; border: none; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; }
    button:hover { background: #D4A574; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>E-<span class="accent">Dome</span></h1>
    <p>Vous êtes actuellement hors connexion.<br>Vérifiez votre connexion internet et réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
